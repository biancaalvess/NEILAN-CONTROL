# Produção: Neon PostgreSQL via DATABASE_URL (ou PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD)
# Ex.: postgresql://USER:PASSWORD@HOST/DB?sslmode=require
# Preferir sslmode=require; evitar channel_binding=require no JDBC se o driver reclamar.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:neilan}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true

server.forward-headers-strategy=framework
