# Produção: Neon PostgreSQL — DatabaseConfig monta o DataSource a partir de DATABASE_URL.
# Valores abaixo são placeholders; o bean customizado substitui a auto-configuração.
spring.datasource.url=jdbc:postgresql://localhost:5432/neondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true

server.forward-headers-strategy=framework
