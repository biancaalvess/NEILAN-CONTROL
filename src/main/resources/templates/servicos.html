<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout :: layout('Serviços Feitos', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>Serviços Realizados</h2>
        <p>Histórico de lavagens e estéticas</p>
    </div>

    <form class="filters" method="get" th:action="@{/servicos}">
        <div class="form-group">
            <label for="inicio">De</label>
            <input type="date" id="inicio" name="inicio" th:value="${inicio}">
        </div>
        <div class="form-group">
            <label for="fim">Até</label>
            <input type="date" id="fim" name="fim" th:value="${fim}">
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Filtrar</button>
        <a th:href="@{/export/csv(inicio=${inicio}, fim=${fim})}" class="btn btn-secondary btn-sm">📥 Exportar CSV</a>
    </form>

    <div class="summary-bar">
        <span><strong th:text="${quantidade}">0</strong> serviço(s) no período</span>
        <span>Total: <strong th:text="'R$ ' + ${#numbers.formatDecimal(totalPeriodo, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</strong></span>
    </div>

    <div th:if="${#lists.isEmpty(servicos)}" class="empty-state">
        <div class="icon">📋</div>
        <p>Nenhum serviço encontrado neste período.</p>
    </div>

    <div th:unless="${#lists.isEmpty(servicos)}" class="table-container">
        <table>
            <thead>
            <tr>
                <th>Data/Hora</th>
                <th>Serviço</th>
                <th>Categoria</th>
                <th>Cliente</th>
                <th>Placa</th>
                <th>Valor</th>
                <th>Obs.</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicos}">
                <td th:text="${#temporals.format(s.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                <td th:text="${s.tipoServico.nome}">Serviço</td>
                <td><span class="badge badge-categoria" th:text="${s.tipoServico.categoria}">Cat</span></td>
                <td th:text="${s.clienteNome != null ? s.clienteNome : '-'}">-</td>
                <td th:text="${s.placa != null ? s.placa : '-'}">-</td>
                <td class="valor"
                    th:text="'R$ ' + ${#numbers.formatDecimal(s.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                <td th:text="${s.observacoes != null ? s.observacoes : '-'}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
