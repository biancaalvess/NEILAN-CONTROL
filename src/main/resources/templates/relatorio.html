<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout :: layout('Relatório', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2 th:text="${titulo}">Relatório</h2>
        <p>Lucro e desempenho por período</p>
    </div>

    <div class="tabs">
        <a th:href="@{/relatorio(periodo='diario')}" th:class="${periodo == 'diario' ? 'tab active' : 'tab'}">Diário</a>
        <a th:href="@{/relatorio(periodo='mensal')}" th:class="${periodo == 'mensal' ? 'tab active' : 'tab'}">Mensal</a>
        <a th:href="@{/relatorio(periodo='trimestral')}" th:class="${periodo == 'trimestral' ? 'tab active' : 'tab'}">Trimestral</a>
        <a th:href="@{/relatorio(periodo='anual')}" th:class="${periodo == 'anual' ? 'tab active' : 'tab'}">Anual</a>
    </div>

    <div class="cards-grid">
        <div class="card card-gold">
            <div class="card-label">Lucro Total</div>
            <div class="card-value"
                 th:text="'R$ ' + ${#numbers.formatDecimal(resumo.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
        </div>
        <div class="card card-gold">
            <div class="card-label">Serviços Realizados</div>
            <div class="card-value" th:text="${resumo.quantidade}">0</div>
        </div>
        <div class="card card-gold" th:if="${resumo.quantidade > 0}">
            <div class="card-label">Ticket Médio</div>
            <div class="card-value"
                 th:text="'R$ ' + ${#numbers.formatDecimal(resumo.total / resumo.quantidade, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
        </div>
    </div>

    <div class="page-header" style="margin-top:1rem">
        <h2>Ranking por Serviço</h2>
    </div>

    <div th:if="${#lists.isEmpty(ranking)}" class="empty-state">
        <p>Sem dados para este período.</p>
    </div>

    <div th:unless="${#lists.isEmpty(ranking)}" class="form-card" style="max-width:100%">
        <div th:each="item, stat : ${ranking}" class="ranking-bar">
            <div class="ranking-bar-header">
                <span th:text="${item.nome}">Serviço</span>
                <span>
                    <strong th:text="'R$ ' + ${#numbers.formatDecimal(item.total, 1, 'POINT', 2, 'COMMA')}">R$ 0</strong>
                    (<span th:text="${item.quantidade}">0</span>x)
                </span>
            </div>
            <div class="ranking-bar-track">
                <div class="ranking-bar-fill"
                     th:style="'width:' + ${item.percentual} + '%'">
                </div>
            </div>
        </div>
    </div>

    <hr class="section-divider">

    <div class="actions-row">
        <a th:href="@{/export/csv}" class="btn btn-secondary">📥 Exportar CSV</a>
    </div>

    <div th:unless="${#lists.isEmpty(servicos)}" class="table-container" style="margin-top:1.5rem">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Serviço</th>
                <th>Cliente</th>
                <th>Valor</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${servicos}">
                <td th:text="${#temporals.format(s.dataHora, 'dd/MM/yyyy HH:mm')}">-</td>
                <td th:text="${s.tipoServico.nome}">-</td>
                <td th:text="${s.clienteNome != null ? s.clienteNome : '-'}">-</td>
                <td class="valor"
                    th:text="'R$ ' + ${#numbers.formatDecimal(s.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
