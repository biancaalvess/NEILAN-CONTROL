<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout :: layout('Configuração', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>Configuração de Serviços</h2>
        <p>Defina quais serviços você oferece e seus valores</p>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

    <div class="form-card" style="margin-bottom:2rem">
        <h3 style="color:var(--gold);margin-bottom:1rem;font-size:1rem">Adicionar Novo Serviço</h3>
        <form th:action="@{/configuracao/novo}" th:object="${novoServico}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Polimento">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria *</label>
                    <select id="categoria" th:field="*{categoria}" required>
                        <option value="">Selecione...</option>
                        <option value="Estética Automotiva">Estética Automotiva</option>
                        <option value="Lavagem de Estofados">Lavagem de Estofados</option>
                        <option value="Lavagens em Geral">Lavagens em Geral</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" th:field="*{preco}" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" th:field="*{descricao}" placeholder="Descrição breve">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">➕ Adicionar Serviço</button>
        </form>
    </div>

    <div class="page-header">
        <h2>Serviços Cadastrados</h2>
    </div>

    <div th:if="${#lists.isEmpty(tiposServico)}" class="empty-state">
        <p>Nenhum serviço configurado.</p>
    </div>

    <div th:each="tipo : ${tiposServico}" class="config-item">
        <div class="config-item-header">
            <h4 th:text="${tipo.nome}">Serviço</h4>
            <span th:class="${tipo.ativo ? 'badge badge-ativo' : 'badge badge-inativo'}"
                  th:text="${tipo.ativo ? 'Ativo' : 'Inativo'}">Ativo</span>
        </div>
        <form th:action="@{/configuracao/{id}/editar(id=${tipo.id})}" method="post">
            <div class="config-form-grid">
                <input type="text" name="nome" th:value="${tipo.nome}" required placeholder="Nome">
                <select name="categoria" required>
                    <option value="Estética Automotiva" th:selected="${tipo.categoria == 'Estética Automotiva'}">Estética Automotiva</option>
                    <option value="Lavagem de Estofados" th:selected="${tipo.categoria == 'Lavagem de Estofados'}">Lavagem de Estofados</option>
                    <option value="Lavagens em Geral" th:selected="${tipo.categoria == 'Lavagens em Geral'}">Lavagens em Geral</option>
                </select>
                <input type="number" name="preco" th:value="${tipo.preco}" step="0.01" min="0.01" required placeholder="Preço">
                <label class="checkbox-label">
                    <input type="checkbox" name="ativo" value="true" th:checked="${tipo.ativo}">
                    Ativo
                </label>
                <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
            </div>
            <input type="hidden" name="descricao" th:value="${tipo.descricao}">
        </form>
        <form th:action="@{/configuracao/{id}/excluir(id=${tipo.id})}" method="post" style="margin-top:0.5rem"
              onsubmit="return confirm('Remover este serviço?')">
            <button type="submit" class="btn btn-danger">Excluir</button>
        </form>
    </div>
</main>
</body>
</html>
