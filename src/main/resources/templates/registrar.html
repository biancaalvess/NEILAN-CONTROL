<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout :: layout('Registrar Serviço', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>Registrar Serviço</h2>
        <p>Registre uma lavagem ou estética realizada</p>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-error" th:text="${erro}"></div>

    <div class="form-card">
        <form th:action="@{/registrar}" th:object="${servicoForm}" method="post">
            <div class="form-group">
                <label for="tipoServicoId">Serviço *</label>
                <select id="tipoServicoId" th:field="*{tipoServicoId}" required>
                    <option value="">Selecione o serviço...</option>
                    <option th:each="tipo : ${tiposServico}"
                            th:value="${tipo.id}"
                            th:text="${tipo.nome + ' — R$ ' + #numbers.formatDecimal(tipo.preco, 1, 'POINT', 2, 'COMMA')}"
                            th:attr="data-preco=${tipo.preco}">
                    </option>
                </select>
                <div class="form-error" th:if="${#fields.hasErrors('tipoServicoId')}" th:errors="*{tipoServicoId}"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="clienteNome">Cliente</label>
                    <input type="text" id="clienteNome" th:field="*{clienteNome}" placeholder="Nome do cliente">
                </div>
                <div class="form-group">
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" th:field="*{placa}" placeholder="ABC1D23" maxlength="10">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="valor">Valor (R$) *</label>
                    <input type="number" id="valor" th:field="*{valor}" step="0.01" min="0.01" required>
                    <div class="form-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                </div>
                <div class="form-group">
                    <label for="dataHora">Data e Hora</label>
                    <input type="datetime-local" id="dataHora" th:field="*{dataHora}">
                </div>
            </div>

            <div class="form-group">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes" th:field="*{observacoes}" placeholder="Detalhes adicionais..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">✓ Registrar Serviço</button>
        </form>
    </div>
</main>
</body>
</html>
