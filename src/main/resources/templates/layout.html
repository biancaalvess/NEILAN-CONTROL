<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR" th:fragment="layout (pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle + ' - Neilan Control'}">Neilan Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<button class="menu-toggle" aria-label="Menu">☰</button>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>Neilan Control</h1>
            <p>Estética Automotiva</p>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}"><span class="icon">📊</span> Dashboard</a>
            <a th:href="@{/registrar}"><span class="icon">➕</span> Registrar Serviço</a>
            <a th:href="@{/servicos}"><span class="icon">📋</span> Serviços Feitos</a>
            <a th:href="@{/relatorio}"><span class="icon">📈</span> Relatório</a>
            <a th:href="@{/configuracao}"><span class="icon">⚙️</span> Configuração</a>
            <a th:href="@{/export/csv}"><span class="icon">📥</span> Exportar CSV</a>
        </nav>
    </aside>

    <main class="main-content" th:replace="${content}">
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
