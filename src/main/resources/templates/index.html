<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR"
      th:replace="~{layout :: layout('Dashboard', ~{::main})}">
<body>
<main>
    <div class="page-header">
        <h2>Dashboard</h2>
        <p>Controle financeiro — Neilan Estética Automotiva</p>
    </div>

    <div class="cards-grid">
        <div class="card card-gold" th:each="resumo : ${resumos}">
            <div class="card-label" th:text="${resumo.periodo}">Diário</div>
            <div class="card-value"
                 th:text="'R$ ' + ${#numbers.formatDecimal(resumo.total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
            <div class="card-sub" th:text="${resumo.quantidade} + ' serviço(s)'">0 serviços</div>
        </div>
    </div>

    <div class="actions-row">
        <a th:href="@{/registrar}" class="btn btn-primary">➕ Registrar Serviço</a>
        <a th:href="@{/relatorio}" class="btn btn-secondary">📈 Ver Relatório</a>
        <a th:href="@{/export/csv}" class="btn btn-secondary">📥 Exportar CSV</a>
    </div>

    <hr class="section-divider">

    <div class="page-header">
        <h2>Últimos Serviços</h2>
    </div>

    <div th:if="${#lists.isEmpty(ultimosServicos)}" class="empty-state">
        <div class="icon">🚗</div>
        <p>Nenhum serviço registrado ainda.</p>
        <a th:href="@{/registrar}" class="btn btn-primary" style="margin-top:1rem">Registrar primeiro serviço</a>
    </div>

    <div th:unless="${#lists.isEmpty(ultimosServicos)}" class="table-container">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Serviço</th>
                <th>Cliente</th>
                <th>Placa</th>
                <th>Valor</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${ultimosServicos}">
                <td th:text="${#temporals.format(s.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2025</td>
                <td th:text="${s.tipoServico.nome}">Lavagem</td>
                <td th:text="${s.clienteNome != null ? s.clienteNome : '-'}">-</td>
                <td th:text="${s.placa != null ? s.placa : '-'}">-</td>
                <td class="valor"
                    th:text="'R$ ' + ${#numbers.formatDecimal(s.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
