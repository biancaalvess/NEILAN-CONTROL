# Neon = banco | Render = API Java | Vercel = frontend (vercel.json)
services:
  - type: web
    name: neilan-control
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon: cole a connection string (postgresql://user:pass@host/db?sslmode=require)
      # Não use DATABASE_HOST/PORT — o app lê DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
