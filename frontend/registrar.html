<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>Registrar Serviço - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<header class="mobile-header" id="mobile-header"></header>
<div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <h2>Registrar Serviço</h2>
            <p>Registre uma lavagem ou estética realizada</p>
        </div>
        <div id="alert-box"></div>
        <div class="form-card">
            <form id="registrar-form">
                <div class="form-group">
                    <label for="busca-tipo">Buscar serviço</label>
                    <div class="search-box">
                        <span class="search-icon" aria-hidden="true"></span>
                        <input type="search" id="busca-tipo" placeholder="Digite o nome do serviço..." autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label for="tipoServicoId">Serviço *</label>
                    <select id="tipoServicoId" required></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="clienteNome">Cliente</label>
                        <input type="text" id="clienteNome" placeholder="Nome do cliente" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="placa">Placa</label>
                        <input type="text" id="placa" placeholder="ABC1D23" maxlength="10" autocapitalize="characters">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="valor">Valor *</label>
                        <div class="input-currency">
                            <span class="input-currency-prefix" aria-hidden="true">R$</span>
                            <input type="number" id="valor" step="0.01" min="0.01" required inputmode="decimal" placeholder="0,00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="dataHora">Data e Hora</label>
                        <input type="datetime-local" id="dataHora">
                    </div>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" placeholder="Detalhes adicionais..."></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Registrar Serviço</button>
            </form>
        </div>
    </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script src="js/transitions.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/registrar.js"></script>
</body>
</html>
