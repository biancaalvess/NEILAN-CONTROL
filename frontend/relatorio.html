<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>Relatórios - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<header class="mobile-header" id="mobile-header"></header>
<div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <h2 id="relatorio-titulo">Relatórios</h2>
            <p id="relatorio-subtitulo">DRE simplificada — receita, custos e lucro líquido</p>
        </div>
        <div class="tabs tabs--scroll" id="periodo-tabs">
            <a href="#" class="tab" data-periodo="diario">Diário</a>
            <a href="#" class="tab" data-periodo="mensal">Mensal</a>
            <a href="#" class="tab" data-periodo="trimestral">Trimestral</a>
            <a href="#" class="tab" data-periodo="anual">Anual</a>
        </div>
        <div id="alert-box"></div>
        <div id="cards-grid" class="cards-grid cards-grid--2col"></div>
        <div id="dre-detalhes" class="form-card form-card--full"></div>
        <div class="page-header page-header--compact"><h2>Detalhamento por período</h2></div>
        <div id="tabela-dre" class="form-card form-card--full"></div>
        <div class="page-header page-header--compact"><h2>Ranking por Serviço</h2></div>
        <div id="ranking-servicos" class="form-card form-card--full"></div>
        <div class="page-header page-header--compact"><h2>Ranking por Custo</h2></div>
        <div id="ranking-custos" class="form-card form-card--full"></div>
    </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script src="js/transitions.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/relatorio.js"></script>
</body>
</html>
