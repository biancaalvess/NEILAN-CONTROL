<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>Saída - Custos - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<header class="mobile-header" id="mobile-header"></header>
<div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content page-custos">
        <div class="page-header page-header--compact">
            <h2>Saída — Custos</h2>
            <p>Registre despesas e acompanhe os gastos</p>
        </div>
        <div id="alert-box"></div>

        <div class="expense-dashboard" id="expense-dashboard">
            <span class="expense-dashboard-label">Visão dos gastos</span>
            <div id="expense-dashboard-content"></div>
        </div>

        <div class="form-card">
            <form id="custo-form">
                <div class="form-group">
                    <label for="descricao">Descrição *</label>
                    <input type="text" id="descricao" required placeholder="Ex: produtos, alimentação..." maxlength="200">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="valor">Valor *</label>
                        <div class="input-currency">
                            <span class="input-currency-prefix" aria-hidden="true">R$</span>
                            <input type="number" id="valor" step="0.01" min="0.01" required inputmode="decimal" placeholder="0,00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="dataHora">Data e Hora</label>
                        <input type="datetime-local" id="dataHora">
                    </div>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" placeholder="Detalhes adicionais..."></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-compact">Lançar Custo</button>
            </form>
        </div>

        <div class="section-divider section-divider--compact">
            <h3>Histórico</h3>
        </div>
        <div class="search-box">
            <span class="search-icon" aria-hidden="true"></span>
            <input type="search" id="busca-custo" placeholder="Buscar por descrição..." autocomplete="off">
        </div>
        <form id="filtro-form" class="filters">
            <div class="form-group">
                <label for="inicio">De</label>
                <input type="date" id="inicio" required>
            </div>
            <div class="form-group">
                <label for="fim">Até</label>
                <input type="date" id="fim" required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm btn-block-mobile">Filtrar</button>
        </form>
        <div id="summary-bar" class="summary-bar"></div>
        <div id="custos-container"></div>
    </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script src="js/transitions.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/custos.js"></script>
</body>
</html>
