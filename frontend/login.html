<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-card">
        <div class="login-brand">
            <img src="public/logo.png" alt="Neilan Estética Automotiva" class="brand-logo">
            <p>Neilan Control</p>
        </div>
        <div id="alert-box"></div>
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autocomplete="username" placeholder="seu@email.com" autofocus>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" id="login-btn" class="btn btn-primary login-btn">Entrar</button>
        </form>
        <p class="login-footer">Acesso restrito ao sistema financeiro</p>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
