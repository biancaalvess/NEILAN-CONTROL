<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="menu-toggle" aria-label="Menu">☰</button>
<div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <h2>Configuração de Serviços</h2>
            <p>Defina quais serviços você oferece e seus valores</p>
        </div>
        <div id="alert-box"></div>
        <div class="form-card" style="margin-bottom:2rem">
            <h3 style="color:var(--gold);margin-bottom:1rem;font-size:1rem">Adicionar Novo Serviço</h3>
            <form id="novo-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" required placeholder="Ex: Polimento">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Selecione...</option>
                            <option value="Estética Automotiva">Estética Automotiva</option>
                            <option value="Lavagem de Estofados">Lavagem de Estofados</option>
                            <option value="Lavagens em Geral">Lavagens em Geral</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" id="preco" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Descrição breve">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">➕ Adicionar Serviço</button>
            </form>
        </div>
        <div class="page-header"><h2>Serviços Cadastrados</h2></div>
        <div id="tipos-container"></div>
    </main>
</div>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/configuracao.js"></script>
</body>
</html>
