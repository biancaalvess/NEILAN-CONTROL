<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>Configuração - Neilan Control</title>
    <link rel="icon" href="public/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<header class="mobile-header" id="mobile-header"></header>
<div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
        <div class="page-header">
            <h2>Configuração de Serviços</h2>
            <p>Defina quais serviços você oferece e seus valores</p>
        </div>
        <div id="alert-box"></div>
        <div class="form-card form-card--full" style="margin-bottom:1.25rem">
            <h3 class="section-title">Adicionar Novo Serviço</h3>
            <form id="novo-form">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" required placeholder="Ex: Polimento">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria *</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Estética Automotiva">Estética Automotiva</option>
                        <option value="Lavagem de Estofados">Lavagem de Estofados</option>
                        <option value="Lavagens em Geral">Lavagens em Geral</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="preco">Preço *</label>
                        <div class="input-currency">
                            <span class="input-currency-prefix" aria-hidden="true">R$</span>
                            <input type="number" id="preco" step="0.01" min="0.01" required inputmode="decimal" placeholder="0,00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" placeholder="Descrição breve">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Adicionar Serviço</button>
            </form>
        </div>
        <div class="page-header page-header--compact"><h2>Serviços Cadastrados</h2></div>
        <div id="tipos-container" class="config-list"></div>
    </main>
</div>
<nav class="bottom-nav" id="bottom-nav"></nav>
<script src="js/transitions.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/configuracao.js"></script>
</body>
</html>
